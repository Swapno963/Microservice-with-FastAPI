apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: shopverce
  labels:
    app: user-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: swapno/user-service:latest
          ports:
            - containerPort: 8003
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: USER_DATABASE_URL
            - name: API_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: API_PREFIX
            - name: DEBUG
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DEBUG
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: USER_SERVICE_PORT
            - name: JWT_SECRET_KEY
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: JWT_SECRET_KEY
            - name: JWT_ALGORITHM
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: JWT_ALGORITHM
            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ACCESS_TOKEN_EXPIRE_MINUTES
            - name: REFRESH_TOKEN_EXPIRE_DAYS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REFRESH_TOKEN_EXPIRE_DAYS
            - name: SECRET_KEY
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SECRET_KEY
            - name: SECURITY_PASSWORD_SALT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SECURITY_PASSWORD_SALT
            - name: SECURITY_PASSWORD_HASH
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SECURITY_PASSWORD_HASH
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: shopverce
spec:
  selector:
    app: user-service
  ports:
    - port: 8003
      targetPort: 8003
  type: ClusterIP
